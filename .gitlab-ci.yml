# GitLab CI for jPDF Desk.
# Requires Linux x86_64 Docker runners. QtBase and MuPDF are built from
# the pinned source submodules.
# AppImage is not built here: it requires externally supplied linuxdeploy tools.
stages:
  - test
  - build
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: debian:13
  interruptible: true
  timeout: 2 hours
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GET_SOURCES_ATTEMPTS: "5"
  GIT_DEPTH: "1"
  GIT_STRATEGY: fetch
  # Initialize only the submodules required by the PDF-only build below.
  GIT_SUBMODULE_STRATEGY: none
  DEBIAN_FRONTEND: noninteractive
  # Override on runners with limited memory; Qt builds are memory-intensive.
  BUILD_JOBS: "2"

.cmake_job:
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates git build-essential cmake ninja-build perl python3 pkg-config file \
        libssl-dev openssl libcups2-dev \
        libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libx11-dev \
        libx11-xcb-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
        libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
        libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
        libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
        libxcb-xkb-dev libxext-dev libxfixes-dev libxi-dev libxkbcommon-dev \
        libxkbcommon-x11-dev libxrender-dev
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git config --global user.name "${GITLAB_USER_NAME:-GitLab CI}"
      git config --global user.email "${GITLAB_USER_EMAIL:-gitlab-ci@$CI_SERVER_HOST}"
      # Use Artifex's HTTPS mirrors, including MuPDF's relative third-party URLs.
      git config --global url.https://github.com/ArtifexSoftware/.insteadOf git://git.ghostscript.com/
      git submodule sync
      git submodule update --init thirdparty/qtbase thirdparty/mupdf
      git -C thirdparty/mupdf submodule sync
      git -C thirdparty/mupdf submodule update --init \
        thirdparty/freetype thirdparty/jbig2dec thirdparty/libjpeg \
        thirdparty/lcms2 thirdparty/openjpeg thirdparty/zlib

linux_tests:
  extends: .cmake_job
  stage: test
  script:
    - cmake --preset debug --fresh
    - cmake --build --preset debug --parallel "$BUILD_JOBS"
    - ctest --preset debug --no-tests=error --output-junit test-results.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: .build/debug/test-results.xml
    paths:
      - .build/debug/Testing/Temporary/LastTest.log

# Validate distribution builds on branches and MRs as well as on tags.
linux_packages:
  extends: .cmake_job
  stage: build
  parallel:
    matrix:
      - CMAKE_PRESET: [linux-executable, linux-deb, linux-rpm]
  script:
    - |
      set -eu
      case "$CMAKE_PRESET" in
        linux-deb) apt-get install -y --no-install-recommends dpkg-dev ;;
        linux-rpm) apt-get install -y --no-install-recommends rpm ;;
      esac
      cmake --preset "$CMAKE_PRESET" --fresh
      cmake --build --preset "$CMAKE_PRESET" --parallel "$BUILD_JOBS"
      output="dist/$CMAKE_PRESET"
      mkdir -p "$output"
      case "$CMAKE_PRESET" in
        linux-executable)
          test -s ".build/$CMAKE_PRESET/gui/jpdf-desk"
          cp ".build/$CMAKE_PRESET/gui/jpdf-desk" "$output/"
          ;;
        linux-deb)
          cpack --preset "$CMAKE_PRESET"
          test "$(dpkg-deb --field .build/linux-deb/packages/*.deb Architecture)" = amd64
          cp .build/linux-deb/packages/*.deb "$output/"
          ;;
        linux-rpm)
          cpack --preset "$CMAKE_PRESET"
          cp .build/linux-rpm/packages/*.rpm "$output/"
          ;;
      esac
      (cd "$output" && sha256sum * > SHA256SUMS)
  artifacts:
    name: "$CI_PROJECT_NAME-$CMAKE_PRESET-$CI_COMMIT_REF_SLUG"
    expire_in: 1 month
    paths:
      - dist/$CMAKE_PRESET/

windows_packages:
  extends: .cmake_job
  stage: build
  script:
    - |
      set -eu
      apt-get install -y --no-install-recommends mingw-w64 mingw-w64-tools nsis
      # QT_HOST_PATH in the MinGW presets points to this native build.
      cmake --preset release --fresh
      cmake --build --preset release --target jpdf-desk --parallel "$BUILD_JOBS"
      # Windows-target OpenSSL is not available in the Debian image. These
      # packages support editing/printing, but not cryptographic signing.
      cmake --preset windows-installer --fresh -DJPDF_DESK_WITH_OPENSSL=OFF
      cmake --build --preset windows-installer --parallel "$BUILD_JOBS"
      cpack --preset windows-installer
      mkdir -p dist/windows-x86_64
      test -s .build/windows-installer/gui/jpdf-desk.exe
      cp .build/windows-installer/gui/jpdf-desk.exe dist/windows-x86_64/
      cp .build/windows-installer/packages/*.exe dist/windows-x86_64/
      (cd dist/windows-x86_64 && sha256sum * > SHA256SUMS)
  artifacts:
    name: "$CI_PROJECT_NAME-windows-x86_64-$CI_COMMIT_REF_SLUG"
    expire_in: 1 month
    paths:
      - dist/windows-x86_64/

# Keep publication manual until the packages have been exercised on target OSes.
publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  interruptible: false
  needs:
    - job: linux_tests
      artifacts: false
    - job: linux_packages
      artifacts: true
    - job: windows_packages
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false
    - when: never
  variables:
    PACKAGE_FILE: "${CI_PROJECT_NAME}-${CI_COMMIT_TAG}-all.tar.gz"
  script:
    - apk add --no-cache coreutils curl
    - |
      set -eu
      mkdir -p release
      cp -R dist/* release/
      cp README.md LICENSE release/
      (
        cd release
        find . -type f ! -name SHA256SUMS -print0 \
          | sort -z | xargs -0 sha256sum > SHA256SUMS
      )
      tar -czf "$PACKAGE_FILE" release
      printf '## jPDF Desk %s\n\nLinux x86_64 executable, DEB and RPM packages, and Windows x86_64 executable and installer. Includes README, license and SHA-256 checksums.\n\nLinux builds require compatible system desktop libraries (built on Debian 13). Windows builds do not include cryptographic signing/verification; editing, signature images and printing remain available.\n' \
        "$CI_COMMIT_TAG" > release-notes.md
      # Publish individual packages as well as the complete release archive.
      for directory in dist/*; do
        platform="$(basename "$directory")"
        for file in "$directory"/*; do
          test -f "$file"
          remote_file="${platform}-$(basename "$file")"
          curl --fail --show-error --location \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$file" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$remote_file"
        done
      done
      curl --fail --show-error --location \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "$PACKAGE_FILE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$PACKAGE_FILE"
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG"
    paths:
      - release/
      - release-notes.md
      - "*.tar.gz"
    expire_in: never
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "jPDF Desk $CI_COMMIT_TAG"
    description: release-notes.md
    assets:
      links:
        - name: Release files
          url: "$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"
          link_type: other
        - name: Release archive
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$CI_PROJECT_NAME/$CI_COMMIT_TAG/$PACKAGE_FILE"
          link_type: package

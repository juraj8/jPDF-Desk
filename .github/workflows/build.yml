name: Build and test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Resolve CI image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/ci-build:debian13" >> "$GITHUB_OUTPUT"

  linux:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ needs.image.outputs.name }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        preset:
          - release-linux
          - release-windows
          - release-linux-static
          - release-linux-arm64
          - release-windows-static
    env:
      BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ARM64 sysroot
        if: matrix.preset == 'release-linux-arm64'
        run: bash script/setup-aarch64-sysroot.sh
      - name: Install AppImage tools
        if: matrix.preset == 'release-linux'
        run: |
          mkdir -p /opt/appimage-tools
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o /opt/appimage-tools/linuxdeploy
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            -o /opt/appimage-tools/linuxdeploy-plugin-appimage
          chmod +x /opt/appimage-tools/*
          echo /opt/appimage-tools >> "$GITHUB_PATH"
      - name: Build ${{ matrix.preset }}
        run: bash script/ci-build.sh "${{ matrix.preset }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist/${{ matrix.preset }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.preset }}
          path: |
            .build/*/test-results.xml
            .build/*/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja make pkg-config openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build macOS ARM64
        run: bash script/ci-build.sh release-mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64
          path: dist/release-mac-arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release-mac-arm64
          path: |
            .build/release-mac-arm64/test-results.xml
            .build/release-mac-arm64/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Initialize source submodules
        run: |
          git submodule sync
          git submodule update --init thirdparty/qtbase thirdparty/mupdf
          git -C thirdparty/mupdf submodule sync
          git -C thirdparty/mupdf submodule update --init \
            thirdparty/freetype thirdparty/jbig2dec thirdparty/libjpeg \
            thirdparty/lcms2 thirdparty/openjpeg thirdparty/zlib
      - name: Build and test Snap
        id: snap
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: latest/stable
      - name: Collect Snap
        run: |
          mkdir -p dist/release-linux-snap
          cp "${{ steps.snap.outputs.snap }}" dist/release-linux-snap/
          (cd dist/release-linux-snap && sha256sum *.snap > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-snap
          path: dist/release-linux-snap/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    needs: [linux, macos, snap]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a tag such as v1.1.0 or v1.1.0-rc1"
            exit 1
          fi
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          output="$PWD/release-assets"
          # Keep each build and its own SHA256SUMS together: filenames overlap.
          for preset in linux linux-static linux-arm64 windows windows-static mac-arm64 linux-snap; do
            directory="artifacts/release-$preset"
            test -s "$directory/SHA256SUMS"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            # Actions artifacts normalize file modes; restore Linux executables.
            if [[ "$preset" == linux* ]]; then
              find "$directory" -type f \( -name jpdf-desk -o -name '*.AppImage' \) -exec chmod +x {} +
            fi
            (cd "$directory" && zip -r "$output/jpdf-desk-$RELEASE_TAG-$preset.zip" .)
          done
          (cd release-assets && sha256sum *.zip > SHA256SUMS)
      - name: Create draft, upload, and publish
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease=true --latest=false)
          else
            flags+=(--prerelease=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo "::error::Release is already published; refusing to replace its assets. Use a new tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "jPDF Desk $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          # A failed upload leaves a draft, which a rerun can safely complete.
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"

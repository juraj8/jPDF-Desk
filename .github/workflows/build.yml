name: Build and test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/build-linux.yml

  macos:
    name: macOS Apple Silicon bundle
    # Qt requires macOS SDK 15+ and Xcode 16+.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_JOBS: "3"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja make pkg-config openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build, test, and package macOS app
        run: bash script/ci-build.sh release-mac-arm64
      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-mac-arm64
          path: dist/release-mac-arm64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release-mac-arm64
          path: |
            .build/release-mac-arm64/test-results.xml
            .build/release-mac-arm64/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

  snap:
    name: Linux x64 Snap package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize source submodules
        run: |
          git submodule sync
          git submodule update --init thirdparty/qtbase thirdparty/mupdf
          git -C thirdparty/mupdf submodule sync
          git -C thirdparty/mupdf submodule update --init \
            thirdparty/freetype thirdparty/jbig2dec thirdparty/libjpeg \
            thirdparty/lcms2 thirdparty/openjpeg thirdparty/zlib
      - name: Build and test Snap
        id: snap
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: latest/stable
      - name: Collect Snap and checksums
        run: |
          mkdir -p dist/release-linux-snap
          cp "${{ steps.snap.outputs.snap }}" dist/release-linux-snap/
          (cd dist/release-linux-snap && sha256sum *.snap > SHA256SUMS)
      - name: Upload Snap package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-snap
          path: dist/release-linux-snap/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    needs: [linux, macos, snap]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a tag such as v1.1.0 or v1.1.0-rc1"
            exit 1
          fi
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          output="$PWD/release-assets"
          # Require every listed artifact and verify its checksum before staging it.
          required_artifacts=(
            # Linux
            linux-deb
            linux-deb-ubuntu22.04
            linux-rpm
            linux-snap
            linux-appimage
            linux-static
            linux-arm64

            # Windows
            windows
            windows-static

            # macOS
            mac-arm64
          )
          for preset in "${required_artifacts[@]}"; do
            directory="artifacts/release-$preset"
            test -s "$directory/SHA256SUMS"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            # Actions artifacts normalize file modes; restore Linux executables.
            if [[ "$preset" == linux* ]]; then
              find "$directory" -type f \( -name jpdf-desk -o -name '*.AppImage' \) -exec chmod +x {} +
            fi
            case "$preset" in
              linux-static|linux-arm64)
                tar -czf "$output/jpdf-desk-$RELEASE_TAG-$preset.tar.gz" -C "$directory" jpdf-desk
                ;;
              windows-static)
                (cd "$directory" && zip "$output/jpdf-desk-$RELEASE_TAG-$preset.zip" jpdf-desk.exe)
                ;;
              linux-appimage) cp "$directory"/*.AppImage "$output/" ;;
              linux-deb|linux-deb-ubuntu22.04) cp "$directory"/*.deb "$output/" ;;
              linux-rpm) cp "$directory"/*.rpm "$output/" ;;
              windows) cp "$directory"/*.exe "$output/" ;;
              mac-arm64) cp "$directory"/*.tar.gz "$output/" ;;
              linux-snap) cp "$directory"/*.snap "$output/" ;;
            esac
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS)
      - name: Publish GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease=true --latest=false)
          else
            flags+=(--prerelease=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo "::error::Release is already published; refusing to replace its assets. Use a new tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "jPDF Desk $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          # A failed upload leaves a draft, which a rerun can safely complete.
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"

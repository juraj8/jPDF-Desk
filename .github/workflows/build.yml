name: Build and test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Resolve CI image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/ci-build:debian13" >> "$GITHUB_OUTPUT"

  linux:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ${{ needs.image.outputs.name }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        preset:
          - debug
          - release
          - release-win
          - linux-executable
          - linux-aarch64
          - windows-executable
          - linux-deb
          - linux-rpm
          - linux-appimage
          - windows-installer
    env:
      BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ARM64 sysroot
        if: matrix.preset == 'linux-aarch64'
        run: bash script/setup-aarch64-sysroot.sh
      - name: Install AppImage tools
        if: matrix.preset == 'linux-appimage'
        run: |
          mkdir -p /opt/appimage-tools
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o /opt/appimage-tools/linuxdeploy
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            -o /opt/appimage-tools/linuxdeploy-plugin-appimage
          chmod +x /opt/appimage-tools/*
          echo /opt/appimage-tools >> "$GITHUB_PATH"
      - name: Build ${{ matrix.preset }}
        run: bash script/ci-build.sh "${{ matrix.preset }}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          path: dist/${{ matrix.preset }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always() && matrix.preset == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .build/debug/test-results.xml
            .build/debug/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 14

  macos:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install cmake ninja make pkg-config openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build macOS ARM64
        run: bash script/ci-build.sh macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64/
          if-no-files-found: error
          retention-days: 14
